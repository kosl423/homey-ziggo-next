<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body class="homey-widget-full">
<div class="homey-form-group"><label data-i18n="login.username" class="homey-form-label" for="username">Ziggo username</label><input class="homey-form-input" id="username" type="email" autocomplete="username"></div>
<div class="homey-form-group"><label data-i18n="login.password" class="homey-form-label" for="password">Password</label><input class="homey-form-input" id="password" type="password" autocomplete="current-password"></div>
<p data-i18n="repair.intro" >Sign in again to restore this Mediabox session. Your password is not stored. The discovered Mediabox must match the existing device. After repair, wait for live status; use the Ziggo remote once if necessary.</p><button id="repair" data-i18n="repair.button" class="homey-button-primary-full">Restore Ziggo connection</button><p id="status" role="status" aria-live="polite"></p>
<script type="application/javascript">
  Homey.setTitle(Homey.__('repair.title'));
  var button = document.getElementById('repair');
  var status = document.getElementById('status');
  var restored = false;
  function finish() {
    button.disabled = true;
    status.textContent = Homey.__('repair.done');
    return Promise.resolve().then(function () { return Homey.done(); })
      .catch(function () {
        status.textContent = Homey.__('repair.finishFailed');
        button.textContent = Homey.__('repair.finish');
        button.disabled = false;
      });
  }
  button.addEventListener('click', function () {
    if (button.disabled) return;
    if (restored) { finish(); return; }
    var username = document.getElementById('username').value.trim();
    var passwordInput = document.getElementById('password');
    var password = passwordInput.value;
    if (!username || !password) { status.textContent = Homey.__('login.required'); return; }
    button.disabled = true;
    status.textContent = Homey.__('repair.busy');
    Promise.resolve().then(function () { return Homey.emit('repair_ziggo', { username: username, password: password }); })
      .then(function () { restored = true; passwordInput.value = ''; return finish(); })
      .catch(function () { passwordInput.value = ''; status.textContent = Homey.__('repair.failed'); button.disabled = false; });
  });
</script></body></html>
