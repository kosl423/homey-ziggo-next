<!doctype html>
<html>
<head><meta charset="utf-8"></head>
<body class="homey-widget-full">
  <div class="homey-form-group">
    <label class="homey-form-label" for="username">Ziggo-gebruikersnaam</label>
    <input class="homey-form-input" id="username" type="email" autocomplete="username">
  </div>
  <div class="homey-form-group">
    <label class="homey-form-label" for="password">Wachtwoord</label>
    <input class="homey-form-input" id="password" type="password" autocomplete="current-password">
  </div>
  <p>Je wachtwoord wordt alleen voor deze koppeling gebruikt en niet opgeslagen. De Ziggo-sessietokens worden wel op Homey bewaard zodat de Mediabox later zonder opnieuw inloggen bediend kan worden.</p>
  <button id="pair" class="homey-button-primary-full">Koppel mijn Ziggo Next Mini</button>
  <p id="status"></p>
<script type="application/javascript">
  Homey.setTitle('Ziggo Next Mini koppelen');

  var button = document.getElementById('pair');
  var status = document.getElementById('status');

  button.addEventListener('click', function () {
    var username = document.getElementById('username').value.trim();
    var password = document.getElementById('password').value;

    if (!username || !password) {
      status.textContent = 'Vul je Ziggo-gebruikersnaam en wachtwoord in.';
      return;
    }

    button.disabled = true;
    status.textContent = 'Inloggen bij Ziggo en Mediabox zoeken...';

    Homey.emit('pair_ziggo', { username: username, password: password })
      .then(function (device) {
        status.textContent = 'Mediabox gevonden. Toevoegen aan Homey...';
        return Homey.createDevice(device);
      })
      .then(function () {
        status.textContent = 'Ziggo Next Mini is toegevoegd.';
        return Homey.done();
      })
      .catch(function (err) {
        status.textContent = 'Fout: ' + (err && err.message ? err.message : String(err));
        button.disabled = false;
      });
  });
</script>
</body>
</html>
